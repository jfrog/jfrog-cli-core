name: JFrog CLI Core Tests
on:
  workflow_call:
  workflow_dispatch:
jobs:
  test:
    runs-on: ${{ matrix.os }}-latest
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu, windows, macos]
    env:
      GOPROXY: direct
      GRADLE_OPTS: -Dorg.gradle.daemon=false
      JFROG_CLI_LOG_LEVEL: "DEBUG"
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          # Safe: this workflow only runs after human approval via the build-gate environment.
          allow-unsafe-pr-checkout: true

      - name: Setup Python3
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install pipenv & poetry
        run: python -m pip install pipenv poetry

      - name: Install NuGet
        uses: nuget/setup-nuget@v4
        with:
          nuget-version: 6.x

      - name: Install dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "6.x"

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      # Install Mono on Ubuntu to run nuget.exe (due to this issue on Ubuntu 24 that hasn't been fixed yet - https://github.com/NuGet/setup-nuget/issues/168)
      - name: Install Mono on Ubuntu
        if: matrix.os == 'ubuntu'
        run: |
          sudo apt-get update
          sudo apt-get install -y mono-complete

      - name: Setup Go with cache
        uses: jfrog/.github/actions/install-go-with-cache@main

      - name: Tests
        run: go test -v github.com/jfrog/jfrog-cli-core/v2/tests -timeout 0 -race
